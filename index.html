<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAS Feature Flows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one feature per tab, read top to bottom.
   Real UI, then the live site wired to the flowchart, then the flowchart, explanation and breaks.
   Deliberately light-only, matching the Figma file the user specified. */
:root {
  color-scheme: light;
  --bg: #F5F7FA;
  --card: #FFFFFF;
  --ink: #1B2430;
  --ink-2: #2E3A48;
  --muted: #4A5565;
  --soft: #5B6675;
  --line: #DDE3EA;
  --line-2: #C9D2DD;
  --chip: #EEF1F5;
  --tint: #EEF4FF;
  --panel: #F7F9FB;
  --me: #1D4ED8;
  --beef: #C0362C;
  --mark: #E5372B;
  --ok: #166534; --ok-bg: #DCFCE7;
  --glow: #F59E0B; --glow-bg: #FFF7E0;
  --k-event-bg: #E0F2F1; --k-event: #0F766E;
  --k-fn-bg: #E2F3E9; --k-fn: #23774A;
  --k-dec-bg: #F3E8FF; --k-dec: #7A3FB0;
  --k-data-bg: #FEF3C7; --k-data: #A16207;
  --k-screen-bg: #1B2430; --k-screen: #1B2430;
  --k-end-bg: #EEF1F5; --k-end: #8A94A3;
  --t-syntax-bg: #FDE2E0; --t-syntax: #B42318;
  --t-selector-bg: #FEF0C7; --t-selector: #93370D;
  --t-logic-bg: #DBE7FF; --t-logic: #1D4ED8;
  --t-none-bg: #DCFCE7; --t-none: #166534;
  --font: "Poppins", "Noto Sans Thai", system-ui, sans-serif;
  --thai: "Noto Sans Thai", "Poppins", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--me); outline-offset: 2px; }
.p { font-family: var(--thai); }
code.cc { font-family: var(--font); font-size: 0.92em; font-weight: 500; background: var(--chip); color: var(--ink); border-radius: 5px; padding: 1px 6px; overflow-wrap: anywhere; }
.ln { display: inline-block; font-size: 0.86em; font-weight: 600; color: var(--k-fn); background: var(--k-fn-bg); border-radius: 5px; padding: 0 6px; white-space: nowrap; line-height: 1.6; }
.uic { display: inline-block; font-size: 0.9em; font-weight: 600; border: 1px solid var(--line-2); background: var(--card); border-radius: 999px; padding: 0 10px; white-space: nowrap; }
.tested { display: inline-flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 600; color: var(--ok); background: var(--ok-bg); border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
.tested::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1920px; margin: 0 auto; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; }
.brand { font-weight: 700; font-size: 20px; white-space: nowrap; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; flex: 1 1 auto; min-width: 0; padding-bottom: 2px; align-items: center; }
.tab { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 16px; font-weight: 500; white-space: nowrap; }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; }
.tab[aria-selected="true"] { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
.tab:hover:not([aria-selected="true"]) { border-color: var(--soft); }
.tabsep { flex: 0 0 1px; height: 22px; background: var(--line-2); margin: 0 4px; }
.top-links { display: flex; gap: 16px; font-size: 16px; white-space: nowrap; order: 2; margin-left: auto; }
.brand { order: 1; }
.tabs { order: 3; }
@media (max-width: 1280px) { .tabs { flex-basis: 100%; } }
.top-links a { color: var(--me); text-decoration: none; font-weight: 500; }
.top-links a:hover { text-decoration: underline; }

main { max-width: 1920px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.feature { display: flex; flex-direction: column; gap: 22px; }

.head { padding: 4px 4px 8px; display: flex; flex-direction: column; gap: 10px; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 16px; color: var(--muted); }
.owner { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); }
.owner i { width: 10px; height: 10px; border-radius: 50%; }
.head h1 { margin: 0; font-size: clamp(26px, 3.2vw, 42px); line-height: 1.25; text-wrap: balance; }
.files { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 16px; color: var(--muted); }
.files span { display: inline-flex; gap: 6px; align-items: baseline; }
.files b { font-weight: 600; color: var(--ink-2); }

.sec { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px 28px 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.sec > h2 { margin: 0; font-size: clamp(20px, 2vw, 25px); line-height: 1.3; text-wrap: balance; }
.hint { color: var(--soft); font-size: 16px; margin: -10px 0 0; }

/* Real UI */
.uirow { display: flex; align-items: center; gap: 14px; }
.shotcol { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.shot { position: relative; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); cursor: zoom-in; padding: 0; display: block; width: 100%; }
.shot img { display: block; width: 100%; height: auto; border-radius: 9px; }
.mk { position: absolute; transform: translate(-50%, -50%); width: 32px; height: 32px; border-radius: 50%; background: var(--mark); color: #FFFFFF; border: 3px solid #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,.3); display: grid; place-items: center; font-weight: 700; font-size: 16px; line-height: 1; pointer-events: none; }
.cap { font-size: 16px; color: var(--muted); margin: 0; line-height: 1.55; }
.cap .tested { margin-left: 6px; }
.inset-cap { font-size: 16px; font-weight: 500; color: var(--muted); margin: 0; }
.action { flex: 0 0 150px; display: flex; flex-direction: column; gap: 10px; }
.act { display: flex; gap: 8px; align-items: flex-start; font-size: 16px; font-weight: 500; line-height: 1.4; }
.act .b { flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--mark); color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: 16px; }
.arrow { height: 14px; position: relative; }
.arrow::before { content: ""; position: absolute; left: 0; right: 10px; top: 6px; height: 3px; background: var(--mark); border-radius: 2px; }
.arrow::after { content: ""; position: absolute; right: 0; top: 0; border: 7px solid transparent; border-left: 12px solid var(--mark); border-right: 0; }

/* Live site + flowchart */
.pbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.pbar .push { margin-left: auto; }
.tbtn { padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 16px; }
.tbtn:hover { border-color: var(--soft); }
.tbtn[aria-pressed="true"] { background: var(--ink); color: #FFFFFF; border-color: var(--ink); }
.tbtn.primary { background: var(--ink); color: #FFFFFF; border-color: var(--ink); font-weight: 600; }
.combo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 1100px) { .combo { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); } }
.pane { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stage { position: relative; height: 600px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); overflow: hidden; }
.stage-sizer { position: relative; height: 100%; margin: 0 auto; }
.stage iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #FFFFFF; }
.stage-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 16px; padding: 20px; }
.stage-empty p { margin: 0; }
.flowtools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 15px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 24px; height: 16px; border-radius: 5px; border: 2px solid; }
.sw.dec { border-style: dashed; border-radius: 9px; }
.flowview { position: relative; height: 600px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card); overscroll-behavior: contain; }
.flowsizer { position: relative; }
.canvas { position: absolute; left: 0; top: 0; width: 1728px; transform-origin: 0 0; padding: 0; }
.canvas svg { position: absolute; left: 0; top: 0; overflow: visible; }
.canvas path.e { transition: stroke .25s, stroke-width .25s; }
.canvas path.e.on { stroke: var(--glow); stroke-width: 4; }
.node { position: absolute; border: 2px solid; border-radius: 10px; padding: 10px 13px; display: flex; flex-direction: column; gap: 4px; transition: box-shadow .25s, transform .25s; }
.node .t { font-weight: 600; font-size: 17px; line-height: 1.4; overflow-wrap: anywhere; }
.node .t .ln { margin-left: 6px; }
.node .s { font-size: 16px; line-height: 1.45; color: var(--muted); overflow-wrap: anywhere; }
.node.dec { border-style: dashed; border-radius: 22px; }
.node.screen .t { color: #FFFFFF; }
.node.screen .s { color: #D5DCE6; }
.node.screen code.cc { background: #2E3A48; color: #FFFFFF; }
.node.screen .ln { background: #2E3A48; color: #BFE8CC; }
.node.lit { box-shadow: 0 0 0 4px var(--glow), 0 6px 18px rgba(245,158,11,.35); }
.node.now { transform: scale(1.04); }
.lbl { position: absolute; background: var(--card); font-size: 16px; font-weight: 500; line-height: 1.3; padding: 0 5px; border-radius: 6px; white-space: nowrap; }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--panel); }
.box h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; color: var(--soft); }
.tasks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
.tasks li { display: flex; gap: 10px; align-items: baseline; line-height: 1.45; }
.tasks .tb { flex: 0 0 24px; height: 24px; border-radius: 50%; background: var(--mark); color: #FFFFFF; display: grid; place-items: center; font-weight: 700; font-size: 13px; position: relative; top: 3px; }
.tasks li.done { color: var(--soft); }
.tasks li.done span:last-child { text-decoration: line-through; text-decoration-color: var(--line-2); }
.tasks li.done .tb { background: var(--ok); }
.steps { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 8px; font-size: 15px; counter-reset: s; }
.steps li { display: inline-flex; gap: 6px; align-items: baseline; opacity: .4; transition: opacity .2s; line-height: 1.4; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px 2px 4px; }
.steps li::before { counter-increment: s; content: counter(s); flex: 0 0 20px; height: 20px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: 12px; font-weight: 700; position: relative; top: 4px; }
.steps li.on { opacity: 1; border-color: var(--glow); }
.steps li.on::before { background: var(--glow); color: #FFFFFF; }
.empty-note { font-size: 16px; color: var(--soft); margin: 0; }
.varstrip { display: flex; flex-wrap: wrap; gap: 8px; }
.vi { display: inline-flex; align-items: baseline; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; background: var(--panel); font-size: 16px; transition: background-color .4s; max-width: 100%; }
.vi b { font-weight: 600; overflow-wrap: anywhere; }
.vi.changed { background: var(--glow-bg); border-color: var(--glow); }
.cons-vi { flex: 1 1 280px; }
.lab2 { font-size: 15px; color: var(--soft); white-space: nowrap; }
.cons1 { font-size: 15px; overflow-wrap: anywhere; }
.combo-sec.full { position: fixed; inset: 0; z-index: 40; border-radius: 0; overflow: auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.combo-sec.full .stage, .combo-sec.full .flowview { height: calc(100vh - 380px); min-height: 340px; }
.combo-sec.full > h2, .combo-sec.full > .hint { display: none; }
body.noscroll { overflow: hidden; }
@media (max-width: 1099px) { .stage { height: 520px; } .flowview { height: 460px; } }


.node { border: 0 !important; padding: 0 !important; background: none !important; }
.node .sym { position: absolute; overflow: visible; pointer-events: none; }
.node .sym > * { fill: var(--f); stroke: var(--s); stroke-width: 2; transition: stroke .25s, stroke-width .25s; }
.node .sym line { fill: none; }
.node .nc { position: relative; display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; }
.node.event .nc, .node.end .nc { padding: 10px 24px; }
.node.fn .nc { padding: 10px 20px; }
.node.screen .nc { padding: 10px 26px 10px 24px; }
.node.dec .nc { padding: 8px 12px; background: var(--f); border-radius: 8px; }
.node.lit { box-shadow: none !important; }
.node.lit .sym > * { stroke: var(--glow); stroke-width: 4; }
.node.lit .sym { filter: drop-shadow(0 4px 10px rgba(245,158,11,.45)); }
.lgi { flex: 0 0 auto; overflow: visible; }
.lgi > * { fill: var(--f); stroke: var(--s); stroke-width: 2; }
.lgi line { fill: none; }
.legend b { font-weight: 600; color: var(--ink-2); }


/* wiring */
.wiring { border: 1px solid var(--line); border-radius: 12px; background: var(--card); margin-top: 4px; }
.wiring summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 12px 18px; font-size: 17px; }
.wiring summary .wt { font-weight: 600; color: var(--ink); margin-right: 4px; }
.lang { display: inline-block; font-size: 15px; font-weight: 600; border-radius: 5px; padding: 0 7px; line-height: 1.6; }
.lang.HTML { background: #FDE8DF; color: #B4410F; }
.lang.CSS { background: #DBE7FF; color: #1D4ED8; }
.lang.JS { background: #FEF3C7; color: #8A5A00; }
.wtab { width: 100%; border-collapse: collapse; font-size: 16px; }
.wtab th { text-align: left; font-weight: 600; color: var(--soft); font-size: 15px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel); }
.wtab td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; line-height: 1.55; }
.wtab .c-f { white-space: nowrap; }
.wtab .c-f .lang { margin-right: 8px; min-width: 42px; text-align: center; }
.wtab .c-f b { font-weight: 600; color: var(--ink-2); }
.wtab code.cc { display: inline-block; margin: 1px 0; }
.wtab code.sel { background: #FFF4EC; color: #8A2F0B; }
.wtab tr.r-CSS code.sel { background: #EEF3FF; color: #1E40AF; }
.wtab tr.r-JS code.sel { background: #FFF8E1; color: #6B4700; }
.wtab .c-x code.cc { background: var(--k-fn-bg); color: #1B5E3A; }
@media (max-width: 860px) {
  .wtab thead { display: none; }
  .wtab, .wtab tbody, .wtab tr, .wtab td { display: block; width: 100%; }
  .wtab tr { border-top: 1px solid var(--line); padding: 10px 14px; }
  .wtab td { border: 0; padding: 3px 0; }
  .wtab .c-f { white-space: normal; }
  .wtab td:empty { display: none; }
}
/* breaks v2 */
.breaks { grid-template-columns: 1fr !important; }
.bk-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px 26px; }
@media (max-width: 900px) { .bk-cols { grid-template-columns: 1fr; } }
.bk-txt { display: flex; flex-direction: column; gap: 6px; }
.bk-code { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bk-code .lab { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.key { display: inline-flex; gap: 6px; align-items: center; font-weight: 500; }
.key i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; margin-left: 6px; }
.key .kd { background: #FDE2E0; border: 1px solid #E5372B; }
.key .ka { background: #DCFCE7; border: 1px solid #16A34A; }
.codev { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #FBFCFD; }
.codev .cf { font-size: 15px; font-weight: 600; color: var(--soft); padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.codev .cf:not(:first-child) { border-top: 1px solid var(--line); }
.codev .cl { overflow-x: auto; padding: 4px 0; }
.codev .row { display: flex; gap: 12px; font-size: 16px; line-height: 1.7; min-width: max-content; padding-right: 12px; }
.codev .n { flex: 0 0 52px; text-align: right; color: var(--soft); font-size: 15px; padding-right: 4px; }
.codev .t { white-space: pre; color: var(--ink-2); }
.codev .row.del { background: #FDE2E0; }
.codev .row.del .t { text-decoration: line-through; text-decoration-color: #E5372B; text-decoration-thickness: 2px; color: #8F1D14; }
.codev .row.del .n { color: #B42318; font-weight: 600; }
.codev .row.add { background: #DCFCE7; }
.codev .row.add .t { color: #14532D; font-weight: 500; }
.codev .row.add .n { color: #166534; font-weight: 700; }
.pv-btn { align-self: flex-start; font: inherit; font-size: 16px; font-weight: 600; color: #fff; background: var(--ink); border: 0; border-radius: 8px; padding: 9px 18px; cursor: pointer; }
.pv-btn[aria-expanded="true"] { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.pv-btn:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
.pv { border-top: 1px dashed var(--line-2); margin-top: 6px; padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
.pv-act { margin: 0; font-size: 17px; }
.pv-act b { font-weight: 600; margin-right: 6px; }
.pv-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 760px) { .pv-pair { grid-template-columns: 1fr; } }
.cap { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cap figcaption { font-size: 16px; font-weight: 600; }
.cap.ok figcaption { color: var(--ok); }
.cap.bad figcaption { color: #B42318; }
.cap img { display: block; width: 100%; height: auto; max-height: 560px; object-fit: contain; object-position: top left; border-radius: 8px; border: 2px solid var(--line); background: #fff; }
.cap.ok img { border-color: #86EFAC; }
.cap.bad img { border-color: #FCA5A5; }
.pv-meta { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; }
.pv-same { margin: 0; width: 100%; font-size: 17px; font-weight: 600; color: #93370D; background: #FEF0C7; border-radius: 8px; padding: 8px 12px; }
.facts { border-collapse: collapse; font-size: 16px; }
.facts th { text-align: left; font-weight: 600; color: var(--soft); font-size: 15px; padding: 4px 14px 4px 0; }
.facts td { padding: 4px 14px 4px 0; border-top: 1px solid var(--line); }
.facts td.bad { color: #B42318; font-weight: 600; }
.pv-cons { min-width: 240px; }
.cline { font-size: 16px; padding: 4px 10px; border-left: 3px solid var(--line-2); background: var(--panel); margin-top: 4px; }
.cline.err { border-color: #E5372B; background: #FDE2E0; color: #8F1D14; }
.pv-quiet { margin: 0; font-size: 16px; color: var(--soft); }

/* Explanations */
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 1000px) { .two { grid-template-columns: minmax(0, 520px) minmax(0, 1fr); } }
.easy { background: var(--tint); border-radius: 12px; padding: 20px 24px; }
.easy h3, .deep h3 { margin: 0 0 8px; font-size: 20px; }
.easy p { margin: 0; font-size: 18px; line-height: 1.75; max-width: 62ch; }
.deep { display: flex; flex-direction: column; gap: 18px; padding: 4px 4px; }
.qa h4 { margin: 0 0 4px; font-size: 18px; font-weight: 600; line-height: 1.5; }
.qa p { margin: 0; font-size: 18px; color: var(--ink-2); line-height: 1.7; max-width: 92ch; }
.qa .tested { margin-top: 6px; }

/* Breaks */
.breaks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 18px; }
.bk { border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bk-h { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.bk-h strong { font-size: 18px; }
.bk .lab { font-size: 15px; font-weight: 600; color: var(--soft); margin-top: 4px; }

      '<td class="c-a">' + rich(act) + '</td>';
    body.appendChild(tr);
  }
  tb.appendChild(body); w.appendChild(tb);
  return w;
}

/* ---------- assemble ---------- */
const main = document.getElementById('main'), tabs = document.getElementById('tabs');
const views = {}, combos = {};
for (const k of ORDER) {
  const d = DATA[k], me = d.owner === 'me';
  if (k === 'THEME') tabs.appendChild(el('span', 'tabsep'));
  const label = (k.startsWith('F') ? k + ' ' : '') + d.short;
  const t = el('button', 'tab', '<span class="dot" style="background:var(--' + (me ? 'me' : 'beef') + ')"></span>' + escH(label));
  t.type = 'button'; t.setAttribute('role', 'tab'); t.id = 'tab-' + k.toLowerCase();
  t.addEventListener('click', () => show(k, true)); tabs.appendChild(t);
  const v = el('div', 'feature'); v.id = 'view-' + k.toLowerCase(); v.setAttribute('role', 'tabpanel'); v.hidden = true;
  const head = el('header', 'head');
  const eb = el('div', 'eyebrow');
  eb.appendChild(el('span', 'owner', '<i style="background:var(--' + (me ? 'me' : 'beef') + ')"></i>' + (me ? 'ของวัชรชัย' : 'ของบีฟ')));
  eb.appendChild(el('span', '', d.score ? d.score + ' คะแนน' : 'ฟีเจอร์เสริม'));
  eb.appendChild(el('span', '', rich(d.exam)));
  head.appendChild(eb);
  head.appendChild(el('h1', '', rich((k.startsWith('F') ? k + ' ' : '') + d.title)));
  head.appendChild(buildWiring(d));
  v.appendChild(head);
  buildUI(d, v);
  combos[k] = buildCombo(k, d, v);
  buildExplain(d, v); buildBreaks(d, v, k);
  main.appendChild(v); views[k] = v;
}
let cur = null;
function show(k, push) {
  for (const x of ORDER) { views[x].hidden = x !== k; document.getElementById('tab-' + x.toLowerCase()).setAttribute('aria-selected', x === k); }
  cur = k; combos[k].refit();
  if (push) { try { history.replaceState(null, '', '#' + k.toLowerCase()); } catch (e) {} window.scrollTo({ top: 0 }); }
}
const start = (location.hash || '').slice(1).toUpperCase();
show(ORDER.includes(start) ? start : 'F5', false);
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => combos[cur].refit(), 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => combos[cur].relayout());
window.addEventListener('hashchange', () => { const h = (location.hash || '').slice(1).toUpperCase(); if (ORDER.includes(h) && h !== cur) show(h, false); });

</script>
